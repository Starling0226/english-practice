<!DOCTYPE html>

    <style>
        /* Custom styles to mimic React component mounting animations and hide scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .animate-fade-in { animation: slideUpFade 0.5s ease-out forwards; }
        .animate-zoom-in { animation: zoomIn 0.3s ease-out forwards; }
        
        /* 3D perspective for swipe cards */
        .perspective-1000 { perspective: 1000px; }
    </style>
</head>

                        <span id="app-title-text">Participle Challenge</span>

                <div class="hidden md:flex bg-white/20 p-1 rounded-xl backdrop-blur-sm">

                    <button onclick="switchMode('phrasals')" id="btn-mode-phra-desk" class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-white hover:bg-white/10">Phrasals</button>

        </div>

            <button onclick="switchMode('participles')" id="btn-mode-part-mob" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-red-700 shadow-sm">Participles</button>

        </div>
        
        <!-- Day Selector -->
        <div class="max-w-5xl mx-auto mt-4 overflow-hidden">
            <div id="day-selector-container" class="flex overflow-x-auto gap-2 pb-2 snap-x px-1 no-scrollbar">
                <!-- Days will be injected here -->
            </div>
        </div>
    </header>

            { id: 'exam', icon: 'award', label: 'Exam' }
        ];

        const PHRASAL_TABS = [
            { id: 'study', icon: 'book-open', label: 'Study' },

            { id: 'exam', icon: 'award', label: 'Quiz' }
        ];

        // --- GLOBAL STATE & UTILS ---
        let state = {
            day: 'Monday',
            mode: 'participles', // 'participles' | 'phrasals'
            tab: 'study',
            masteryData: JSON.parse(localStorage.getItem('verbMastery') || '{}')
        };

        let currentActiveModule = null; // Holds the cleanup function of the current mode

        const speakText = (text, rate = 0.8) => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = rate;
                window.speechSynthesis.speak(utterance);
            }
        };
        // Expose globally for inline onclick handlers
        window.speakText = speakText;

        const updateMastery = (verbInfinitive, isCorrect) => {
            const currentScore = state.masteryData[verbInfinitive] || 0;
            const newScore = isCorrect ? Math.min(currentScore + 1, 3) : Math.max(currentScore - 1, -2);
            state.masteryData[verbInfinitive] = newScore;
            localStorage.setItem('verbMastery', JSON.stringify(state.masteryData));
        };

        const checkFormMatch = (input, correct) => {
            const normInput = input.toLowerCase().trim().replace(/[/]/g, '');
            const normCorrectParts = correct.toLowerCase().split('/').map(s => s.trim().replace(/[/]/g, ''));
            return normCorrectParts.some(part => normInput === part || normInput.includes(part));
        };

        // --- UI SHELL RENDERING ---

            document.getElementById('day-selector-container').innerHTML = daysHtml;
            lucide.createIcons({ root: document.getElementById('day-selector-container') });

            // Render Bottom Navigation
            const tabs = state.mode === 'participles' ? PARTICIPLE_TABS : PHRASAL_TABS;
            const navHtml = tabs.map(tab => {
                const isActive = state.tab === tab.id;
                const activeColor = state.mode === 'participles' ? 'red' : 'indigo';
                return `
                <button
                    onclick="switchTab('${tab.id}')"
                    class="flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2 p-2 md:px-4 md:py-3 w-full md:w-auto md:flex-1 rounded-xl font-semibold transition-colors text-[10px] md:text-base snap-center ${
                        isActive 
                        ? `text-${activeColor}-600 md:bg-${activeColor}-50 md:border md:border-${activeColor}-100` 
                        : 'text-slate-500 hover:text-slate-800 md:hover:bg-slate-50 border border-transparent'
                    }"
                >
                    <div class="${isActive ? `bg-${activeColor}-100 p-1.5 rounded-lg md:bg-transparent md:p-0` : 'p-1.5'} flex items-center justify-center">
                        <i data-lucide="${tab.icon}" class="w-5 h-5 md:w-[18px] md:h-[18px]"></i>
                    </div>
                    <span>${tab.label}</span>
                </button>
            `}).join('');
            document.getElementById('bottom-nav-container').innerHTML = navHtml;
            lucide.createIcons({ root: document.getElementById('bottom-nav-container') });
        }

        function switchMode(mode) {
            state.mode = mode;
            state.tab = 'study';
            renderApp();
        }

        function switchDay(day) {
            state.day = day;
            state.tab = 'study';
            renderApp();
        }

        function switchTab(tab) {
            state.tab = tab;
            renderApp();
            window.scrollTo(0, 0);
        }

        function renderApp() {
            renderShell();
            const mainEl = document.getElementById('main-content');
            
            // Clean up previous mode intervals/listeners
            if (currentActiveModule && currentActiveModule.cleanup) {
                currentActiveModule.cleanup();
                currentActiveModule = null;
            }

            // Clear main content
            mainEl.innerHTML = '';

            // Route to proper module
            if (state.mode === 'participles') {
                switch(state.tab) {
                    case 'study': currentActiveModule = initStudyMode(mainEl); break;
                    case 'context': currentActiveModule = initContextMode(mainEl); break;
                    case 'swipe': currentActiveModule = initSwipeMode(mainEl); break;
                    case 'connect': currentActiveModule = initConnectMode(mainEl); break;
                    case 'scramble': currentActiveModule = initScrambleMode(mainEl); break;
                    case 'exam': currentActiveModule = initExamMode(mainEl); break;
                    default: currentActiveModule = initStudyMode(mainEl);
                }
            } else {
                switch(state.tab) {
                    case 'study': currentActiveModule = initPhrasalStudyMode(mainEl); break;
                    case 'write': currentActiveModule = initPhrasalWriteMode(mainEl); break;
                    case 'exam': currentActiveModule = initPhrasalExamMode(mainEl); break;
                    default: currentActiveModule = initPhrasalStudyMode(mainEl);
                }
            }
            
            lucide.createIcons({ root: mainEl });
        }

        // --- MODULES (Participles) ---

        function initStudyMode(container) {
            const verbs = planData[state.day] || [];
            let expandedIndex = null;

            function render() {
                let html = `
                <div class="animate-fade-in">

                        </div>

                    const scoreDots = [1, 2, 3].map(i =>

                    html += `
                        <div class="bg-white rounded-2xl shadow-sm border ${isExpanded ? 'border-red-300 ring-2 ring-red-50' : 'border-slate-200'} overflow-hidden transition-all">

                                    <h3 class="text-xl sm:text-2xl font-black text-slate-800">${v.i}</h3>
                                    <div class="flex items-center gap-2 mt-1">
                                        <span class="text-sm text-slate-500">Past: <span class="font-semibold text-slate-700">${v.p}</span></span>
                                        <span class="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded-md ${v.t === 'Regular' ? 'bg-emerald-100 text-emerald-700' : 'bg-orange-100 text-orange-700'}">${v.t}</span>
                                    </div>
                                    <p class="text-sm font-medium text-slate-600 mt-2">${v.s}</p>
                                </div>
                                <div class="flex flex-col items-end gap-3">
                                    <button onclick="event.stopPropagation(); speakText('${v.i}, ${v.p}, ${v.pp}')" class="p-2.5 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white rounded-full transition-colors flex items-center justify-center">
                                        <i data-lucide="volume-2" class="w-5 h-5"></i>
                                    </button>
                                    <div class="flex gap-1">${scoreDots}</div>
                                </div>
                            </div>
                            <div class="mx-4 mb-4 bg-red-50 p-3 sm:p-4 rounded-xl border border-red-100 flex justify-between items-center cursor-pointer" onclick="window.studyModeToggle(${index})">
                                <div>
                                    <p class="text-[10px] font-bold text-red-400 uppercase tracking-wider">Goal: Past Participle</p>
                                    <p class="text-xl sm:text-2xl font-black text-red-700 mt-0.5">${v.pp}</p>
                                </div>
                                <i data-lucide="${isExpanded ? 'chevron-up' : 'chevron-down'}" class="text-red-400 w-5 h-5"></i>
                            </div>
                    `;

                    if (isExpanded) {
                        html += `
                            <div class="bg-slate-50 border-t border-slate-100 p-4 space-y-3">
                                ${createExampleCard('Infinitive', v.form, v.ex.i[0], v.ex.i[1], false)}
                                ${createExampleCard('Simple Past', v.p, v.ex.p[0], v.ex.p[1], false)}
                                ${createExampleCard('Past Participle', v.pp, v.ex.pp[0], v.ex.pp[1], true)}
                            </div>
                        `;
                    }
                    html += `</div>`;
                });

                html += `</div></div>`;
                container.innerHTML = html;
                lucide.createIcons({ root: container });
            }

            function createExampleCard(title, form, eng, esp, highlight) {
                const escapedEng = eng.replace(/'/g, "\\'");
                return `
                    <div class="p-3 rounded-lg relative ${highlight ? 'bg-red-100 border border-red-200 shadow-sm' : 'bg-white border border-slate-200'}">
                        <div class="text-[10px] font-bold uppercase tracking-wide mb-1 ${highlight ? 'text-red-600' : 'text-slate-400'}">${title}</div>
                        <div class="text-slate-800 font-semibold text-sm pr-8">"${eng}"</div>
                        <div class="text-slate-500 text-xs mt-0.5">"${esp}"</div>
                        <button onclick="speakText('${escapedEng}')" class="absolute top-3 right-3 p-1 rounded-full transition-colors flex justify-center items-center ${highlight ? 'text-red-500 bg-red-200 hover:bg-red-300' : 'text-slate-400 bg-slate-100 hover:bg-slate-200'}">
                            <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                        </button>
                    </div>
                `;
            }

            window.studyModeToggle = (idx) => {
                expandedIndex = expandedIndex === idx ? null : idx;
                render();
            };

            render();
            return { cleanup: () => { delete window.studyModeToggle; } };
        }

        function initContextMode(container) {
            const verbs = planData[state.day] || [];
            let currentVerb = null;
            let options = [];
            let status = 'playing';
            let selectedOption = null;

            function getNewChallenge() {
                currentVerb = verbs[Math.floor(Math.random() * verbs.length)];
                const correctPP = currentVerb.pp.split('/')[0];
                let newOptions = [correctPP];
                
                const simplePast = currentVerb.p.split('/')[0];
                if (!newOptions.includes(simplePast)) newOptions.push(simplePast);
                
                while (newOptions.length < 3) {
                    const randomPP = verbs[Math.floor(Math.random() * verbs.length)].pp.split('/')[0];
                    if (!newOptions.includes(randomPP)) newOptions.push(randomPP);
                }
                
                options = newOptions.sort(() => Math.random() - 0.5);
                status = 'playing';
                selectedOption = null;
                render();
            }

            function render() {
                if (!currentVerb) return;
                const correctPP = currentVerb.pp.split('/')[0];
                const originalSentence = currentVerb.ex.pp[0];
                const blankedSentence = originalSentence.replace(new RegExp(`\\b${correctPP}\\b`, 'i'), '_________');
                
                let html = `
                <div class="max-w-md mx-auto bg-white p-5 sm:p-8 rounded-2xl shadow-sm border border-slate-200 mt-4 md:mt-10 animate-zoom-in">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-extrabold text-slate-800">Sentence Master</h2>
                        <p class="text-xs text-slate-500 mt-1">Complete the sentence with the <strong class="text-red-500">Past Participle</strong>.</p>
                    </div>
                    <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 mb-6 text-center shadow-inner relative">
                        <p class="text-sm font-bold text-slate-400 mb-2 uppercase tracking-wide">Verb: ${currentVerb.i}</p>
                        <p class="text-xl font-semibold text-slate-700 leading-relaxed">
                            ${status === 'playing' ? blankedSentence : originalSentence.replace(new RegExp(`\\b${correctPP}\\b`, 'i'), `<span class="text-${status === 'correct' ? 'emerald' : 'red'}-600 font-black border-b-2 border-${status === 'correct' ? 'emerald' : 'red'}-600 pb-0.5">${correctPP}</span>`)}
                        </p>
                        <p class="text-xs text-slate-400 mt-4 italic">"${currentVerb.ex.pp[1]}"</p>
                    </div>
                    <div class="space-y-3">
                `;

                options.forEach(opt => {
                    let btnClass = 'bg-white border-slate-200 hover:border-red-400 hover:bg-red-50 text-slate-700 active:scale-95';
                    if (status !== 'playing') {
                        if (opt === correctPP) btnClass = 'bg-emerald-50 border-emerald-400 text-emerald-700';
                        else if (opt === selectedOption) btnClass = 'bg-red-50 border-red-400 text-red-700';
                        else btnClass = 'bg-slate-50 border-slate-200 text-slate-400 opacity-50';
                    }
                    html += `<button onclick="window.contextHandleSelect('${opt}')" ${status !== 'playing' ? 'disabled' : ''} class="w-full p-4 rounded-xl font-bold text-lg border-2 transition-all ${btnClass}">${opt}</button>`;
                });

                html += `</div>`;
                
                if (status !== 'playing') {
                    html += `
                        <button onclick="window.contextNext()" class="w-full mt-6 bg-slate-900 text-white font-bold text-lg py-3.5 rounded-xl hover:bg-slate-800 transition-transform active:scale-95 flex items-center justify-center gap-2">
                            Next Sentence <i data-lucide="arrow-right" class="w-5 h-5"></i>
                        </button>
                    `;
                }
                
                html += `</div>`;
                container.innerHTML = html;
                lucide.createIcons({ root: container });
            }

            window.contextHandleSelect = (opt) => {
                if (status !== 'playing') return;
                const correctPP = currentVerb.pp.split('/')[0];
                const isCorrect = opt === correctPP;
                
                selectedOption = opt;
                status = isCorrect ? 'correct' : 'incorrect';
                updateMastery(currentVerb.i, isCorrect);
                
                if (isCorrect) speakText("Excellent!");
                else {
                    speakText("Incorrect.");
                    setTimeout(() => speakText(correctPP), 1000);
                }
                render();
            };

            window.contextNext = getNewChallenge;
            getNewChallenge();

            return { cleanup: () => { delete window.contextHandleSelect; delete window.contextNext; } };
        }

        function initSwipeMode(container) {
            const verbs = planData[state.day] || [];
            let card = null;
            let lives = 3;
            let score = 0;
            let timeLeft = 5;
            let gameOver = false;
            let animating = '';
            let timerInterval;

            function generateCard() {
                const verb = verbs[Math.floor(Math.random() * verbs.length)];
                const isActuallyCorrect = Math.random() > 0.5;
                let displayPP = verb.pp.split('/')[0];
                
                if (!isActuallyCorrect) {
                    if (Math.random() > 0.5) {
                        let randomVerb;
                        do { randomVerb = verbs[Math.floor(Math.random() * verbs.length)]; } while (randomVerb.i === verb.i);
                        displayPP = randomVerb.pp.split('/')[0];
                    } else {
                        displayPP = verb.i + (verb.i.endsWith('e') ? 'd' : 'ed');
                    }
                }
                card = { infinitive: verb.i, display: displayPP, isCorrect: isActuallyCorrect, translation: verb.s };
                timeLeft = 4;
                animating = '';
                render();
                startTimer();
            }

            function startTimer() {
                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        handleSwipe(false, true); // Timeout
                    } else {
                        updateTimeDisplay();
                    }
                }, 1000);
            }

            function updateTimeDisplay() {
                const el = document.getElementById('swipe-time');
                if (el) {
                    el.innerHTML = `<i data-lucide="timer" class="w-4 h-4 inline"></i> ${timeLeft}s`;
                    lucide.createIcons({ root: el });
                }
            }

            function render() {
                if (gameOver) {
                    container.innerHTML = `
                        <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center mt-4 md:mt-10 animate-zoom-in">
                            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i data-lucide="zap" class="w-10 h-10 text-red-500"></i>
                            </div>
                            <h2 class="text-3xl font-black text-slate-800 mb-2">Game Over!</h2>
                            <p class="text-slate-500 mb-6">You survived and scored:</p>
                            <p class="text-5xl font-black text-red-500 mb-8">${score}</p>
                            <button onclick="window.swipeRestart()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl active:scale-95 transition-transform">Play Again</button>
                        </div>
                    `;
                    lucide.createIcons({ root: container });
                    return;
                }
                if (!card) return;

                let hearts = '';
                for (let i = 1; i <= 3; i++) {
                    hearts += `<i data-lucide="heart" class="w-6 h-6 ${i <= lives ? 'fill-red-500 text-red-500' : 'fill-slate-200 text-slate-200'}"></i>`;
                }

                let animClass = 'translate-x-0 rotate-0 opacity-100';
                if (animating === 'left') animClass = '-translate-x-full rotate-[-15deg] opacity-0';
                else if (animating === 'right') animClass = 'translate-x-full rotate-[15deg] opacity-0';

                container.innerHTML = `
                    <div class="max-w-md mx-auto bg-slate-50 p-4 sm:p-6 rounded-2xl border border-slate-200 text-center mt-4 md:mt-10 relative overflow-hidden">
                        <div class="flex justify-between items-center mb-6 px-2">
                            <div class="flex gap-1">${hearts}</div>
                            <div class="bg-white px-3 py-1 rounded-lg border font-bold text-slate-700 shadow-sm">
                                Score: <span class="text-red-500">${score}</span>
                            </div>
                        </div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Is this the correct Participle?</p>
                        
                        <div class="relative h-64 sm:h-72 w-full perspective-1000">
                            <div id="swipe-card" class="absolute w-full h-full bg-white rounded-2xl shadow-lg border-2 border-slate-100 flex flex-col items-center justify-center p-6 transition-all duration-300 ${animClass}">
                                <div id="swipe-time" class="absolute top-4 right-4 flex items-center gap-1 text-slate-400 font-bold text-sm bg-slate-50 px-2 py-1 rounded-md">
                                    <i data-lucide="timer" class="w-4 h-4"></i> ${timeLeft}s
                                </div>
                                <p class="text-slate-400 font-medium mb-1">${card.translation}</p>
                                <h3 class="text-3xl font-bold text-slate-800 mb-4">${card.infinitive}</h3>
                                <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                                    <i data-lucide="arrow-right" class="text-slate-400 w-6 h-6 rotate-90"></i>
                                </div>
                                <h3 class="text-4xl font-black text-red-600 tracking-wide">${card.display}</h3>
                            </div>
                        </div>

                        <div class="flex justify-between gap-4 mt-8">
                            <button onclick="window.swipeHandle(false)" class="flex-1 bg-white border-2 border-slate-200 text-slate-600 font-bold py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-red-50 hover:border-red-200 hover:text-red-600 active:scale-95 transition-all shadow-sm">
                                <i data-lucide="x-circle" class="w-6 h-6"></i> False
                            </button>
                            <button onclick="window.swipeHandle(true)" class="flex-1 bg-white border-2 border-slate-200 text-slate-600 font-bold py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-emerald-50 hover:border-emerald-200 hover:text-emerald-600 active:scale-95 transition-all shadow-sm">
                                <i data-lucide="check-circle-2" class="w-6 h-6"></i> True
                            </button>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-4 hidden md:block">Use ⬅️ y ➡️ arrows on keyboard</p>
                    </div>
                `;
                lucide.createIcons({ root: container });
            }

            function handleSwipe(userSaysCorrect, isTimeout = false) {
                if (animating || gameOver) return;
                clearInterval(timerInterval);
                animating = userSaysCorrect ? 'right' : 'left';
                render(); // trigger animation class
                
                const success = isTimeout ? false : (userSaysCorrect === card.isCorrect);

                setTimeout(() => {
                    if (success) {
                        score += 10;
                        speakText('Ding', 2.0);
                    } else {
                        lives -= 1;
                        speakText('Wrong', 1.5);
                        if (lives <= 0) gameOver = true;
                    }
                    if (lives > 0 || success) generateCard();
                    else render(); // render game over
                }, 300);
            }

            const keydownHandler = (e) => {
                if (gameOver || !card || animating) return;
                if (e.key === 'ArrowLeft') handleSwipe(false);
                if (e.key === 'ArrowRight') handleSwipe(true);
            };
            window.addEventListener('keydown', keydownHandler);

            window.swipeHandle = handleSwipe;
            window.swipeRestart = () => { lives = 3; score = 0; gameOver = false; generateCard(); };
            
            generateCard();

            return { 
                cleanup: () => { 
                    clearInterval(timerInterval); 
                    window.removeEventListener('keydown', keydownHandler);
                    delete window.swipeHandle; delete window.swipeRestart;
                } 
            };
        }

        function initConnectMode(container) {
            const verbs = planData[state.day] || [];
            let cards = [];
            let selected = null;
            let matched = [];
            let time = 0;
            let playing = false;
            let timerInterval;

            function initGame() {
                const shuffledVerbs = [...verbs].sort(() => Math.random() - 0.5).slice(0, 6);
                let gameCards = [];
                shuffledVerbs.forEach(v => {
                    gameCards.push({ id: `${v.i}-inf`, text: v.i, matchId: v.i, type: 'inf' });
                    gameCards.push({ id: `${v.i}-pp`, text: v.pp.split('/')[0], matchId: v.i, type: 'pp' });
                });
                cards = gameCards.sort(() => Math.random() - 0.5);
                selected = null;
                matched = [];
                time = 0;
                playing = true;
                
                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    time++;
                    const timeEl = document.getElementById('connect-time');
                    if (timeEl) timeEl.textContent = `${time}s`;
                }, 1000);
                render();
            }

            function render() {
                if (matched.length > 0 && matched.length === cards.length) {
                    clearInterval(timerInterval);
                    container.innerHTML = `

                cards.forEach(card => {
                    const isMatched = matched.includes(card.id);
                    const isSelected = selected && selected.id === card.id;
                    let cls = `p-3 sm:p-4 rounded-xl font-bold text-sm sm:text-base transition-all duration-300 shadow-sm border-b-4 flex items-center justify-center min-h-[80px] `;

                    else if (isSelected) cls += 'bg-red-500 border-red-700 text-white scale-105 shadow-md';
                    else if (card.type === 'inf') cls += 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50';
                    else cls += 'bg-slate-100 border-slate-300 text-slate-800 hover:bg-slate-200';

                    html += `<button onclick="window.connectHandleClick('${card.id}')" ${isMatched ? 'disabled' : ''} class="${cls}">${card.text}</button>`;

                html += `</div></div>`;
                container.innerHTML = html;
                lucide.createIcons({ root: container });
            }

            window.connectHandleClick = (cardId) => {
                const card = cards.find(c => c.id === cardId);
                if (matched.includes(card.id) || (selected && selected.id === card.id)) return;
                
                speakText(card.text, 1.2);

                if (!selected) {
                    selected = card;

                    if (selected.matchId === card.matchId && selected.type !== card.type) {
                        matched.push(selected.id, card.id);
                        selected = null;
                    } else {
                        selected = null;
                    }

                render();

            window.connectRestart = initGame;

                const allOtherVerbs = verbs.filter(v => v.pv !== correctVerb.pv);
                const shuffledOthers = [...allOtherVerbs].sort(() => Math.random() - 0.5).slice(0, 3);
                options = [...shuffledOthers, correctVerb].sort(() => Math.random() - 0.5);
                render();
            }

            function render() {
                if (!started) {
                    container.innerHTML = `
                        <div class="max-w-xl mx-auto bg-white p-6 sm:p-10 rounded-2xl shadow-sm border border-slate-200 text-center mt-4 md:mt-10 animate-zoom-in">
                            <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-6">
                                <i data-lucide="award" class="text-indigo-500 w-10 h-10"></i>
                            </div>
                            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-3">Phrasal Quiz</h2>
                            <p class="text-sm sm:text-base text-slate-500 mb-8 px-2">Test your knowledge on today's ${verbs.length} phrasal verbs.</p>
                            <button onclick="window.pExamStart()" class="w-full bg-slate-900 text-white font-bold text-lg py-4 rounded-xl shadow-lg hover:bg-slate-800 active:scale-95 transition-transform flex justify-center items-center gap-2">
                                Start Quiz <i data-lucide="rocket" class="w-5 h-5"></i>
                            </button>
                        </div>
                    `;
                } else if (currentIndex >= shuffledVerbs.length) {
                    const score = answers.filter(a => a.correct).length;
                    const percentage = Math.round((score / verbs.length) * 100);
                    let resHtml = `
                        <div class="max-w-2xl mx-auto bg-white p-4 sm:p-8 rounded-2xl shadow-sm border border-slate-200 mt-2 animate-zoom-in">
                            <div class="text-center mb-6 border-b border-slate-100 pb-6">
                                <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Quiz Results</h2>
                                <div class="text-6xl font-black ${percentage >= 80 ? 'text-emerald-500' : (percentage >= 50 ? 'text-yellow-500' : 'text-red-500')}">${percentage}%</div>
                                <p class="text-slate-500 mt-2 font-medium text-sm">You got ${score} out of ${verbs.length} correct</p>
                            </div>
                            <div class="space-y-3">
                    `;
                    answers.forEach((ans, i) => {
                        resHtml += `
                            <div class="p-4 rounded-xl border flex justify-between items-center ${ans.correct ? 'bg-emerald-50 border-emerald-100' : 'bg-red-50 border-red-100'}">
                                <div class="flex flex-col">
                                    <span class="font-bold text-sm text-slate-800 mb-1">${i+1}. ${ans.verb.s}</span>
                                    ${ans.correct 
                                        ? `<span class="text-emerald-600 font-black text-lg">${ans.verb.pv}</span>`
                                        : `<div class="flex items-center flex-wrap gap-2">
                                            <span class="line-through text-red-400 text-sm">${ans.userSelected}</span>
                                            <span class="text-indigo-700 font-black text-lg">${ans.verb.pv}</span>
                                           </div>`
                                    }
                                </div>
                                <i data-lucide="${ans.correct ? 'check-circle-2' : 'x-circle'}" class="w-6 h-6 flex-shrink-0 ${ans.correct ? 'text-emerald-500' : 'text-red-500'}"></i>
                            </div>
                        `;
                    });
                    resHtml += `
                            </div>
                            <button onclick="window.pExamInit()" class="w-full mt-6 bg-slate-900 text-white font-bold text-lg py-4 rounded-xl hover:bg-slate-800 active:scale-95 transition-transform">Retake Quiz</button>
                        </div>
                    `;
                    container.innerHTML = resHtml;
                } else {
                    const currentV = shuffledVerbs[currentIndex];
                    let qHtml = `
                        <div class="max-w-xl mx-auto bg-white p-6 sm:p-10 rounded-2xl shadow-sm border border-slate-200 text-center relative mt-4 md:mt-10 animate-fade-in">
                            <div class="absolute top-4 left-4 bg-slate-100 px-3 py-1 rounded-full font-bold text-slate-500 text-xs">${currentIndex + 1} / ${verbs.length}</div>
                            <div class="w-full bg-slate-100 h-1.5 absolute top-0 left-0 rounded-t-2xl overflow-hidden">
                                <div class="h-full bg-slate-900 transition-all duration-300" style="width: ${(currentIndex / verbs.length) * 100}%"></div>
                            </div>
                            <p class="text-[11px] sm:text-xs text-slate-400 font-bold uppercase tracking-widest mt-8 mb-1">Select the Phrasal Verb for</p>
                            <h2 class="text-3xl sm:text-4xl font-black text-slate-800 mb-1">${currentV.s}</h2>
                            <div class="mt-8 space-y-3">
                    `;
                    options.forEach((opt, i) => {
                        qHtml += `
                            <button onclick="window.pExamSelect(${i})" class="w-full p-4 border-2 border-slate-200 rounded-xl text-left font-bold text-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all flex items-center justify-between group">
                                ${opt.pv}
                                <i data-lucide="arrow-right" class="w-5 h-5 text-slate-300 group-hover:text-indigo-500 transition-colors"></i>
                            </button>
                        `;
                    });
                    qHtml += `</div></div>`;
                    container.innerHTML = qHtml;
                }
                lucide.createIcons({ root: container });
            }

            window.pExamStart = () => { started = true; generateOptions(shuffledVerbs[0]); };
            window.pExamSelect = (idx) => {
                const selectedVerb = options[idx];
                const currentV = shuffledVerbs[currentIndex];
                answers.push({ verb: currentV, userSelected: selectedVerb.pv, correct: selectedVerb.pv === currentV.pv });
                
                currentIndex++;
                if (currentIndex < verbs.length) generateOptions(shuffledVerbs[currentIndex]);
                else render();
            };
            window.pExamInit = init;

            init();
            return { cleanup: () => { delete window.pExamStart; delete window.pExamSelect; delete window.pExamInit; } };
        }


        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });

    </script>
</body>
</html>
