    <script>
        function updateMastery(verbInfinitive, isCorrect) {
            const currentScore = masteryData[verbInfinitive] || 0;
            const newScore = isCorrect ? Math.min(currentScore + 1, 3) : Math.max(currentScore - 1, -2);
            masteryData[verbInfinitive] = newScore;
            localStorage.setItem('verbMastery', JSON.stringify(masteryData));
        }

        function speak(text, rate = 0.8) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = rate;
                window.speechSynthesis.speak(utterance);
            }
        }

        function normalizeStr(str) {
            return str.toLowerCase().trim().replace(/[/]/g, '');
        }

        function checkForm(input, correct) {
            const normInput = normalizeStr(input);
            const normCorrectParts = correct.toLowerCase().split('/').map(s => s.trim());
            return normCorrectParts.some(part => normInput === part || normInput.includes(part));
        }

        /* --- Rendering Engine --- */

        // Day Selector
        function renderDaySelector() {
            const container = document.getElementById('day-selector');
            container.innerHTML = DAYS.map(day => `
                <button
                    onclick="setDay('${day}')"
                    class="flex-shrink-0 px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg font-bold transition-all flex items-center gap-1.5 snap-start text-sm sm:text-base ${
                        currentDay === day 
                        ? 'bg-yellow-400 text-red-900 shadow-sm' 
                        : 'bg-white/10 text-white hover:bg-white/20 border border-white/20'
                    }"
                >
                    <i data-lucide="calendar" class="w-[14px] h-[14px] md:w-[16px] md:h-[16px]"></i>
                    ${day}
                </button>
            `).join('');
            lucide.createIcons();
        }

        // Bottom/Top Navigation Tabs
        function renderTabs() {
            const tabs = [
                { id: 'study', icon: 'book-open', label: 'Study' },
                { id: 'write', icon: 'edit-3', label: 'Write' },
                { id: 'spell', icon: 'mic', label: 'Spell' },
                { id: 'listen', icon: 'headphones', label: 'Listen' },
                { id: 'exam', icon: 'award', label: 'Exam' }
            ];

            const container = document.getElementById('mode-tabs');
            container.innerHTML = tabs.map(tab => `
                <button
                    onclick="setTab('${tab.id}')"
                    class="flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2 p-2 md:px-4 md:py-3 w-full md:w-auto md:flex-1 rounded-xl font-semibold transition-colors text-[10px] md:text-base snap-center ${
                        activeTab === tab.id 
                        ? 'text-red-600 md:bg-red-50 md:border md:border-red-100' 
                        : 'text-slate-500 hover:text-slate-800 md:hover:bg-slate-50 border border-transparent'
                    }"
                >
                    <div class="${activeTab === tab.id ? 'bg-red-100 p-1.5 rounded-lg md:bg-transparent md:p-0' : 'p-1.5'}">
                        <i data-lucide="${tab.icon}" class="w-5 h-5 md:w-[18px] md:h-[18px]"></i>
                    </div>
                    <span>${tab.label}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        function setDay(day) {
            currentDay = day;
            document.getElementById('current-day-display').textContent = day;
            setTab('study'); 
            renderDaySelector();
        }

        function setTab(tab) {
            activeTab = tab;
            renderTabs();
            renderContent();
            window.scrollTo(0, 0); // Scroll top on tab change for mobile
        }

        let expandedRowIndex = null;
        function toggleRow(index) {
            expandedRowIndex = expandedRowIndex === index ? null : index;
            renderStudyMode();
        }

        function renderStudyMode() {
            const verbs = planData[currentDay];
            
            // Using a modern Card-based layout which is immensely better for Mobile
            let content = `
                <div class="mb-4 flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">Daily List</h2>
                        <p class="text-xs text-slate-500">${verbs.length} verbs today</p>
                    </div>
                    <div class="text-xs text-slate-400 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                        Tap ↕ for examples
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 animate-slide-up">
            `;

            verbs.forEach((v, index) => {
                const score = masteryData[v.i] || 0;
                const isExpanded = expandedRowIndex === index;
                
                content += `
                    <div class="bg-white rounded-2xl shadow-sm border ${isExpanded ? 'border-red-300 ring-2 ring-red-50' : 'border-slate-200'} overflow-hidden transition-all">
                        
                        <div class="p-4 sm:p-5 flex justify-between items-start cursor-pointer" onclick="toggleRow(${index})">

                                <h3 class="text-xl sm:text-2xl font-black text-slate-800">${v.i}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-sm text-slate-500">Past: <span class="font-semibold text-slate-700">${v.p}</span></span>
                                    <span class="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded-md ${v.t === 'Regular' ? 'bg-emerald-100 text-emerald-700' : 'bg-orange-100 text-orange-700'}">
                                        ${v.t}
                                    </span>
                                </div>
                                <p class="text-sm font-medium text-slate-600 mt-2">${v.s}</p>
                            </div>
                            
                            <div class="flex flex-col items-end gap-3">
                                <button onclick="event.stopPropagation(); speak('${v.i}, ${v.p}, ${v.pp}')" class="p-2.5 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white rounded-full transition-colors">
                                    <i data-lucide="volume-2" class="w-5 h-5"></i>
                                </button>
                                <div class="flex gap-1">
                                    <div class="w-2 h-2 rounded-full ${score >= 1 ? 'bg-emerald-400' : 'bg-slate-200'}"></div>
                                    <div class="w-2 h-2 rounded-full ${score >= 2 ? 'bg-emerald-400' : 'bg-slate-200'}"></div>
                                    <div class="w-2 h-2 rounded-full ${score >= 3 ? 'bg-emerald-400' : 'bg-slate-200'}"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Target Goal Box inside card -->
                        <div class="mx-4 mb-4 bg-red-50 p-3 sm:p-4 rounded-xl border border-red-100 flex justify-between items-center cursor-pointer" onclick="toggleRow(${index})">
                            <div>
                                <p class="text-[10px] font-bold text-red-400 uppercase tracking-wider">Goal: Past Participle</p>
                                <p class="text-xl sm:text-2xl font-black text-red-700 mt-0.5">${v.pp}</p>
                            </div>
                            <i data-lucide="${isExpanded ? 'chevron-up' : 'chevron-down'}" class="text-red-400 w-5 h-5"></i>
                        </div>

                        ${isExpanded ? `
                            <div class="bg-slate-50 border-t border-slate-100 p-4 space-y-3">
                                ${renderExampleCard("Infinitive", v.i, v.ex.i[0], v.ex.i[1], false)}
                                ${renderExampleCard("Simple Past", v.p, v.ex.p[0], v.ex.p[1], false)}
                                ${renderExampleCard("Past Participle", v.pp, v.ex.pp[0], v.ex.pp[1], true)}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            content += `</div>`;
            document.getElementById('main-content').innerHTML = content;
            lucide.createIcons();

        function renderExampleCard(title, form, eng, esp, highlight) {
            return `
                <div class="p-3 rounded-lg relative ${highlight ? 'bg-red-100 border border-red-200 shadow-sm' : 'bg-white border border-slate-200'}">
                    <div class="text-[10px] font-bold uppercase tracking-wide mb-1 ${highlight ? 'text-red-600' : 'text-slate-400'}">${title}</div>
                    <div class="text-slate-800 font-semibold text-sm pr-8">"${eng}"</div>
                    <div class="text-slate-500 text-xs mt-0.5">"${esp}"</div>
                    <button 
                        onclick="speak('${eng.replace(/'/g, "\\'")}')"
                        class="absolute top-3 right-3 p-1 rounded-full transition-colors ${highlight ? 'text-red-500 bg-red-200 hover:bg-red-300' : 'text-slate-400 bg-slate-100 hover:bg-slate-200'}"
                    >
                        <i data-lucide="play" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `;
        }

        function initWriteMode() {
            const verbs = planData[currentDay];
            const weightedVerbs = [...verbs].sort((a, b) => {
                const scoreA = masteryData[a.i] || 0;
                const scoreB = masteryData[b.i] || 0;
                return scoreA - scoreB;
            });
            const pool = weightedVerbs.slice(0, Math.min(5, verbs.length));
            writeState.currentVerb = pool[Math.floor(Math.random() * pool.length)];
            writeState.status = 'playing';
            renderWriteMode();
        }

        function checkWriteAnswer() {
            if (writeState.status !== 'playing') return;
            const input = document.getElementById('write-input').value;
            const isCorrect = checkForm(input, writeState.currentVerb.pp);
            
            writeState.status = isCorrect ? 'correct' : 'incorrect';
            updateMastery(writeState.currentVerb.i, isCorrect);
            speak(isCorrect ? "Excellent!" : "Incorrect.");
            renderWriteMode();
        }

        function renderWriteMode() {
            if (!writeState.currentVerb) return;
            const v = writeState.currentVerb;
            const masteryLevel = Math.max(0, ((masteryData[v.i] || 0) / 3) * 100);

            let content = `
                <div class="max-w-md mx-auto bg-white p-5 sm:p-8 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden animate-slide-up mt-4 md:mt-10">
                    <div class="absolute top-0 left-0 w-full h-2 bg-slate-100">
                        <div class="h-full bg-emerald-400 transition-all duration-500" style="width: ${masteryLevel}%"></div>
                    </div>

                    <div class="text-center mb-6 mt-2">
                        <p class="text-[11px] sm:text-xs text-slate-400 font-bold uppercase tracking-widest mb-1">Write the Past Participle of</p>
                        <h2 class="text-3xl sm:text-4xl font-extrabold text-red-600 mb-1">${v.s}</h2>
                        <p class="text-sm text-slate-500 font-medium">Infinitive: <span class="font-bold text-slate-700">${v.i}</span></p>
                    </div>

                    <div>
                        <input 
                            type="text" 
                            id="write-input"
                            class="w-full p-4 sm:p-5 border-2 rounded-xl text-center font-black text-2xl focus:outline-none transition-all shadow-inner ${
                                writeState.status !== 'playing' ? 'bg-slate-50' : 'bg-white focus:border-red-500 focus:ring-4 focus:ring-red-50'
                            } ${writeState.status === 'correct' ? 'border-emerald-400 text-emerald-700 bg-emerald-50' : writeState.status === 'incorrect' ? 'border-red-400 bg-red-50' : 'border-slate-300 text-slate-800'}"
                            ${writeState.status !== 'playing' ? 'disabled' : ''}
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="off"
                            spellcheck="false"
                            placeholder="Type here..."
                            onkeydown="if(event.key === 'Enter') checkWriteAnswer()"
                        />
                    </div>
            `;

            if (writeState.status === 'playing') {
                content += `
                    <button onclick="checkWriteAnswer()" class="w-full mt-6 bg-red-600 text-white font-bold text-lg py-3.5 sm:py-4 rounded-xl hover:bg-red-700 shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2">
                        Check Answer
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                `;
            } else {
                content += renderResultBox(writeState.status, v, 'initWriteMode');
            }

            content += `</div>`;
            document.getElementById('main-content').innerHTML = content;
            if(writeState.status === 'playing') {
                // Slight delay for mobile keyboard focus smoothness
                setTimeout(() => document.getElementById('write-input').focus(), 100);
            }
            lucide.createIcons();
        }

        function initSpellMode() {
            const verbs = planData[currentDay];
            spellState.currentVerb = verbs[Math.floor(Math.random() * verbs.length)];
            spellState.status = 'playing';
            renderSpellMode();
        }

        function playSpellWord() {
            if (!spellState.currentVerb) return;
            let wordToSpell = spellState.currentVerb.pp.split('/')[0].trim();
            
            speak(wordToSpell, 0.8);
            setTimeout(() => {
                const chars = wordToSpell.split('');
                chars.forEach((char, index) => {
                    setTimeout(() => speak(` ${char} `, 0.7), index * 1200);
                });
                setTimeout(() => speak(wordToSpell, 0.8), chars.length * 1200 + 800);
            }, 1500);
        }

        function checkSpellAnswer() {
            const input = document.getElementById('spell-input').value;
            let correctAnswer = spellState.currentVerb.pp.split('/')[0].trim();
            
            if (input.toLowerCase().trim() === correctAnswer.toLowerCase().trim()) {
                spellState.status = 'correct';
                speak("Correct!", 1.0);
            } else {
                spellState.status = 'incorrect';
                speak("Incorrect.", 1.0);
            }
            renderSpellMode();
        }

        function renderSpellMode() {
            if (!spellState.currentVerb) return;

            let content = `
                <div class="max-w-md mx-auto bg-white p-5 sm:p-8 rounded-2xl shadow-sm border border-slate-200 text-center animate-slide-up mt-4 md:mt-10">
                    <div class="mb-6">
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-800">Spelling Bee</h2>
                        <p class="text-xs sm:text-sm text-slate-500 mt-1">The voice will spell the <strong class="text-red-500">Past Participle</strong>.</p>
                    </div>

                    <button 
                        onclick="playSpellWord()"
                        class="w-24 h-24 sm:w-28 sm:h-28 mx-auto rounded-full flex items-center justify-center transition-all transform active:scale-90 shadow-lg border-4 border-white ${spellState.status === 'playing' ? 'bg-red-500 text-white hover:bg-red-600 shadow-red-200' : 'bg-slate-100 text-slate-400'}"
                    >
                        <i data-lucide="volume-2" class="w-10 h-10 sm:w-12 sm:h-12"></i>
                    </button>

                    <div class="mt-8">
                        <p class="text-[11px] sm:text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">Type the spelled word</p>
                        <input 
                            type="text" 
                            id="spell-input"
                            class="w-full p-3 sm:p-4 border-b-4 border-slate-200 focus:border-red-500 bg-slate-50 focus:bg-white focus:outline-none text-center text-2xl sm:text-3xl font-extrabold text-slate-800 transition-colors uppercase tracking-[0.3em]"
                            placeholder="_ _ _ _"
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="off"
                            spellcheck="false"
                            ${spellState.status !== 'playing' ? 'disabled' : ''}
                            onkeydown="if(event.key === 'Enter') checkSpellAnswer()"
                        />
                    </div>
            `;

            if (spellState.status === 'playing') {
                content += `<button onclick="checkSpellAnswer()" class="w-full mt-6 bg-red-600 text-white font-bold text-lg py-3.5 sm:py-4 rounded-xl hover:bg-red-700 active:scale-95 transition-transform">Verify</button>`;
            } else {
                content += `
                    <div class="mt-6 p-4 sm:p-5 rounded-xl text-left ${spellState.status === 'correct' ? 'bg-emerald-50 border border-emerald-200' : 'bg-red-50 border border-red-200'}">
                        <div class="flex items-center gap-2 mb-2">
                            <i data-lucide="${spellState.status === 'correct' ? 'check-circle-2' : 'x-circle'}" class="w-6 h-6 ${spellState.status === 'correct' ? 'text-emerald-600' : 'text-red-600'}"></i>
                            <h3 class="text-lg font-bold ${spellState.status === 'correct' ? 'text-emerald-700' : 'text-red-700'}">
                                ${spellState.status === 'correct' ? 'Perfect Spelling!' : 'Incorrect Spelling'}
                            </h3>
                        </div>
                        ${spellState.status === 'incorrect' ? `
                            <p class="text-sm text-slate-600 mb-1">The correct word was:</p>
                            <p class="text-2xl font-black text-red-600 tracking-widest uppercase">${spellState.currentVerb.pp.split('/')[0]}</p>
                        ` : ''}
                        <p class="text-xs text-slate-500 mt-2">Verb: ${spellState.currentVerb.i} (${spellState.currentVerb.s})</p>
                        <button onclick="initSpellMode()" class="w-full mt-4 bg-white border-2 border-slate-200 font-bold py-2.5 rounded-xl hover:bg-slate-50 text-slate-700">Next Word</button>
                    </div>
                `;
            }
            content += `</div>`;
            document.getElementById('main-content').innerHTML = content;
            if(spellState.status === 'playing') setTimeout(() => document.getElementById('spell-input').focus(), 100);
            lucide.createIcons();
        }

        function initListenMode() {
            const verbs = planData[currentDay];
            listenState.currentVerb = verbs[Math.floor(Math.random() * verbs.length)];
            listenState.status = 'playing';
            setTimeout(() => speak(listenState.currentVerb.pp, 0.9), 400);
            renderListenMode();
        }

        function checkListenAnswer() {
            const input = document.getElementById('listen-input').value;
            const isCorrect = input.toLowerCase().trim() === listenState.currentVerb.pp.toLowerCase().trim();
            
            listenState.status = isCorrect ? 'correct' : 'incorrect';
            updateMastery(listenState.currentVerb.i, isCorrect);
            speak(isCorrect ? "Correct!" : "Incorrect.", 1.0);
            renderListenMode();
        }

        function renderListenMode() {
             if (!listenState.currentVerb) return;

             let content = `
                <div class="max-w-md mx-auto bg-white p-5 sm:p-8 rounded-2xl shadow-sm border border-slate-200 text-center animate-slide-up mt-4 md:mt-10">
                    <div class="mb-6">
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-800">Dictation</h2>
                        <p class="text-xs sm:text-sm text-slate-500 mt-1">Listen to the <strong class="text-red-500">Past Participle</strong> and type it.</p>
                    </div>

                    <button 
                        onclick="speak('${listenState.currentVerb.pp}', 0.9)"
                        class="w-24 h-24 sm:w-28 sm:h-28 mx-auto rounded-full flex items-center justify-center transition-all transform active:scale-90 shadow-lg border-4 border-white ${listenState.status === 'playing' ? 'bg-indigo-500 text-white hover:bg-indigo-600 shadow-indigo-200' : 'bg-slate-100 text-slate-400'}"
                    >
                        <i data-lucide="headphones" class="w-10 h-10 sm:w-12 sm:h-12"></i>
                    </button>

                    <div class="mt-8">
                        <input 
                            type="text" 
                            id="listen-input"
                            class="w-full p-4 border-2 rounded-xl border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 bg-slate-50 focus:bg-white focus:outline-none text-center text-2xl font-extrabold text-slate-800 transition-all shadow-inner"
                            placeholder="Type what you hear..."
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="off"
                            spellcheck="false"
                            ${listenState.status !== 'playing' ? 'disabled' : ''}
                            onkeydown="if(event.key === 'Enter') checkListenAnswer()"
                        />
                    </div>
             `;

            if (listenState.status === 'playing') {
                content += `<button onclick="checkListenAnswer()" class="w-full mt-6 bg-indigo-600 text-white font-bold text-lg py-3.5 sm:py-4 rounded-xl hover:bg-indigo-700 active:scale-95 transition-transform">Submit</button>`;
            } else {
                 content += `
                    <div class="mt-6 p-4 rounded-xl text-left ${listenState.status === 'correct' ? 'bg-emerald-50 border border-emerald-200' : 'bg-red-50 border border-red-200'}">
                        <div class="flex items-center gap-2 mb-3">
                            <i data-lucide="${listenState.status === 'correct' ? 'check-circle-2' : 'x-circle'}" class="w-6 h-6 ${listenState.status === 'correct' ? 'text-emerald-600' : 'text-red-600'}"></i>
                            <h3 class="text-lg font-bold ${listenState.status === 'correct' ? 'text-emerald-800' : 'text-red-800'}">
                                ${listenState.status === 'correct' ? 'Correct!' : 'Incorrect!'}
                            </h3>
                        </div>
                        
                        ${listenState.status === 'incorrect' ? `
                            <div class="bg-white p-3 rounded-lg border border-red-100 text-center mb-4 shadow-sm">
                                <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">The spoken participle was</p>
                                <p class="text-2xl font-black text-red-600">${listenState.currentVerb.pp}</p>
                            </div>
                        ` : ''}
                        <p class="text-xs text-slate-500 font-medium text-center mb-3">Infinitive: ${listenState.currentVerb.i} (${listenState.currentVerb.s})</p>
                        
                        <button onclick="initListenMode()" class="w-full bg-white border-2 border-slate-200 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-50 transition-all">
                            Next Audio
                        </button>
                    </div>
                `;
            }
             content += `</div>`;
             document.getElementById('main-content').innerHTML = content;
             if(listenState.status === 'playing') setTimeout(() => document.getElementById('listen-input').focus(), 100);
             lucide.createIcons();
        }

        function initExamMode() {
            examState.started = false;
            examState.currentIndex = 0;
            examState.answers = [];
            examState.shuffledVerbs = [...planData[currentDay]].sort(() => Math.random() - 0.5);
            renderExamMode();
        }

        function startExam() {
            examState.started = true;
            renderExamMode();
        }

        function nextExamQuestion() {
            const inputVal = document.getElementById('exam-input').value;
            const currentV = examState.shuffledVerbs[examState.currentIndex];
            const isCorrect = inputVal.toLowerCase().trim() === currentV.pp.toLowerCase().trim();
            
            examState.answers.push({ verb: currentV, userAnswer: inputVal, correct: isCorrect });
            examState.currentIndex++;
            renderExamMode();
        }

        function renderExamMode() {
            let content = '';
            const verbs = planData[currentDay];

            if (!examState.started) {
                content = `
                    <div class="max-w-xl mx-auto bg-white p-6 sm:p-10 rounded-2xl shadow-sm border border-slate-200 text-center animate-slide-up mt-4 md:mt-10">
                        <div class="w-20 h-20 bg-yellow-50 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="award" class="text-yellow-500 w-10 h-10"></i>
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-3">Competition Simulator</h2>
                        <p class="text-sm sm:text-base text-slate-500 mb-8 px-2">You will be tested on the <strong>Past Participle</strong> of today's 15 verbs at random. Show your speed and accuracy.</p>
                        <button onclick="startExam()" class="w-full bg-slate-900 text-white font-bold text-lg py-4 rounded-xl shadow-lg hover:bg-slate-800 active:scale-95 transition-transform flex justify-center items-center gap-2">
                            Start Exam
                            <i data-lucide="rocket" class="w-5 h-5"></i>
                        </button>
                    </div>
                `;
            } else if (examState.currentIndex >= examState.shuffledVerbs.length) {
                const score = examState.answers.filter(a => a.correct).length;
                const percentage = Math.round((score / verbs.length) * 100);
                
                content = `
                    <div class="max-w-2xl mx-auto bg-white p-4 sm:p-8 rounded-2xl shadow-sm border border-slate-200 animate-slide-up mt-2">
                        <div class="text-center mb-6 border-b border-slate-100 pb-6">
                            <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Final Results</h2>
                            <div class="text-6xl font-black ${percentage >= 80 ? 'text-emerald-500' : (percentage >= 50 ? 'text-yellow-500' : 'text-red-500')}">${percentage}%</div>
                            <p class="text-slate-500 mt-2 font-medium text-sm">You got ${score} out of ${verbs.length} correct</p>
                        </div>
                        
                        <div class="space-y-3">
                            ${examState.answers.map((ans, i) => `
                                <div class="p-4 rounded-xl border flex justify-between items-center ${ans.correct ? 'bg-emerald-50 border-emerald-100' : 'bg-red-50 border-red-100'}">
                                    <div class="flex flex-col">
                                        <span class="font-bold text-sm text-slate-800 mb-1">${i+1}. ${ans.verb.i} <span class="text-xs text-slate-400 font-normal ml-1">(${ans.verb.s})</span></span>
                                        ${ans.correct 
                                            ? `<span class="text-emerald-600 font-black text-lg">${ans.userAnswer}</span>`
                                            : `<div class="flex items-center flex-wrap gap-2">
                                                <span class="line-through text-red-400 text-sm">${ans.userAnswer || '(empty)'}</span>
                                                <span class="text-red-700 font-black text-lg">${ans.verb.pp}</span>
                                               </div>`
                                        }
                                    </div>
                                    <i data-lucide="${ans.correct ? 'check-circle-2' : 'x-circle'}" class="w-6 h-6 flex-shrink-0 ${ans.correct ? 'text-emerald-500' : 'text-red-500'}"></i>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="initExamMode()" class="w-full mt-6 bg-slate-900 text-white font-bold text-lg py-4 rounded-xl hover:bg-slate-800 active:scale-95 transition-transform">Retake Exam</button>
                    </div>
                `;
            } else {
                const currentV = examState.shuffledVerbs[examState.currentIndex];
                content = `
                    <div class="max-w-xl mx-auto bg-white p-6 sm:p-10 rounded-2xl shadow-sm border border-slate-200 text-center relative animate-slide-up mt-4 md:mt-10">
                        <div class="absolute top-4 left-4 bg-slate-100 px-3 py-1 rounded-full font-bold text-slate-500 text-xs">
                            ${examState.currentIndex + 1} / ${verbs.length}
                        </div>
                        
                        <div class="w-full bg-slate-100 h-1.5 absolute top-0 left-0">
                            <div class="h-full bg-slate-900 transition-all duration-300" style="width: ${(examState.currentIndex / verbs.length) * 100}%"></div>
                        </div>
                        
                        <p class="text-[11px] sm:text-xs text-slate-400 font-bold uppercase tracking-widest mt-8 mb-1">Target: Past Participle</p>
                        <h2 class="text-4xl sm:text-5xl font-black text-slate-800 mb-1">${currentV.i}</h2>
                        <p class="text-sm text-slate-500 font-medium mb-8">Meaning: ${currentV.s}</p>
                        
                        <input 
                            type="text" 
                            id="exam-input"
                            class="w-full p-4 border-2 border-slate-200 rounded-xl text-center font-bold text-2xl focus:border-slate-800 focus:ring-4 focus:ring-slate-100 focus:outline-none transition-all shadow-inner bg-slate-50 focus:bg-white"
                            placeholder="Type participle..."
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="off"
                            spellcheck="false"
                            onkeydown="if(event.key === 'Enter') nextExamQuestion()"
                        />
                        
                        <button onclick="nextExamQuestion()" class="w-full mt-6 bg-slate-900 text-white font-bold text-lg py-4 rounded-xl hover:bg-slate-800 active:scale-95 transition-transform flex justify-center items-center gap-2">
                            Next
                            <i data-lucide="arrow-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                `;
            }

            document.getElementById('main-content').innerHTML = content;
            if (examState.started && examState.currentIndex < examState.shuffledVerbs.length) {
                setTimeout(() => document.getElementById('exam-input').focus(), 100);
            }
            lucide.createIcons();
        }

        // Helper for Result Box in Write Mode
        function renderResultBox(status, correctData, nextFunctionStr) {
             return `
                <div class="mt-6 p-4 sm:p-5 rounded-xl text-left animate-slide-up ${status === 'correct' ? 'bg-emerald-50 border border-emerald-200' : 'bg-red-50 border border-red-200'}">
                    <div class="flex items-center gap-2 mb-2">
                        <i data-lucide="${status === 'correct' ? 'check-circle-2' : 'x-circle'}" class="w-6 h-6 ${status === 'correct' ? 'text-emerald-600' : 'text-red-600'}"></i>
                        <h3 class="text-lg font-bold ${status === 'correct' ? 'text-emerald-800' : 'text-red-800'}">
                            ${status === 'correct' ? 'Perfect!' : 'Oops! Look closely:'}
                        </h3>
                    </div>
                    
                    ${status === 'incorrect' ? `
                        <div class="bg-white p-3 rounded-lg border border-red-100 text-center mt-3 mb-3 shadow-sm">
                            <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">Correct Participle</p>
                            <p class="font-black text-2xl sm:text-3xl text-red-600">${correctData.pp}</p>
                        </div>
                    ` : ''}
                    
                    <button onclick="${nextFunctionStr}(); ${status === 'incorrect' ? `speak('${correctData.pp}')` : ''}" class="w-full mt-2 bg-white border-2 border-slate-200 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-50 transition-all flex justify-center items-center gap-2">
                        Next
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            `;
        }

        function renderContent() {
            switch(activeTab) {
                case 'study': renderStudyMode(); break;
                case 'write': initWriteMode(); break;
                case 'spell': initSpellMode(); break;
                case 'listen': initListenMode(); break;
                case 'exam': initExamMode(); break;
            }
        }

        // Initial Setup
        renderDaySelector();
        renderTabs();
        renderContent();
    </script>
</body>
</html>
